<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정기시험 시간표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#dbe5f3; --panel:#ffffff; --ink:#0f2038; --sub:#4d6688; --line:#c1d1e6;
  --accent:#123a68; --accent-ink:#ffffff; --grid:#cedeef; --chip:#d3e1f1;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Noto Sans KR',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --bg-grad-a:#b9d0ef; --bg-grad-b:#e7eefa;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0a1422; --panel:#101d30; --ink:#e6edf7; --sub:#87a0c2; --line:#213554; --grid:#132443; --chip:#132443; --accent:#3f7fc4; --accent-ink:#061119;
    --bg-grad-a:#050b14; --bg-grad-b:#142a4a;
    color-scheme:dark; }
}
*{box-sizing:border-box;}
body{background:linear-gradient(160deg, var(--bg-grad-a), var(--bg-grad-b) 65%, var(--bg));background-attachment:fixed;color:var(--ink);font-family:var(--font-body);margin:0;padding:0 16px;min-height:100vh;}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;}
.wrap{max-width:1100px;margin:0 auto;padding:20px 0 60px;}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);}
.top .logo{height:40px;width:40px;object-fit:contain;border-radius:8px;}
.top h1{font-size:1.3rem;}
.small{font-size:.75rem;color:var(--sub);}
.modetabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.modetab{padding:8px 16px;border:1px solid var(--line);border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--sub);background:var(--panel);transition:background .12s,color .12s,border-color .12s;}
.modetab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.daytabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.daytab{font-family:var(--font-mono);font-size:.78rem;padding:6px 12px;border:1px solid var(--line);border-radius:7px;cursor:pointer;color:var(--sub);background:var(--panel);font-weight:600;transition:background .12s,color .12s,border-color .12s;}
.daytab.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);background:var(--panel);}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:.8rem;table-layout:fixed;}
table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:9px;vertical-align:top;}
table.grid th:first-child,table.grid td:first-child{border-left:none;}
table.grid tr:last-child th,table.grid tr:last-child td{border-bottom:none;}
table.grid tr th:last-child,table.grid tr td:last-child{border-right:none;}
table.grid thead th{background:var(--grid);font-weight:700;text-align:center;color:var(--sub);border-top:none;}
table.grid thead th:first-child{border-top-left-radius:13px;}
table.grid thead th:last-child{border-top-right-radius:13px;}
table.grid .pno{display:block;font-family:var(--font-display);font-weight:700;font-size:.85rem;color:var(--ink);letter-spacing:.01em;}
table.grid .ptime{display:block;font-family:var(--font-mono);font-size:.64rem;color:var(--sub);margin-top:2px;}
table.grid .roomcol{width:88px;background:var(--grid);text-align:left;}
table.grid .roomname{display:block;font-family:var(--font-display);font-weight:700;font-size:.86rem;color:var(--ink);}
table.grid .roomcap{display:inline-block;font-family:var(--font-mono);font-size:.62rem;color:var(--sub);margin-top:3px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1px 7px;}
table.grid .roomcol-big .roomname{color:var(--accent);}
table.grid tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--bg) 100%, var(--ink) 2.5%);}
table.grid td{min-height:74px;background:var(--bg);}
table.grid tbody tr:last-child th:first-child{border-bottom-left-radius:13px;}
.pill{background:var(--panel);border-radius:9px;padding:7px 10px 8px;font-size:.76rem;line-height:1.4;margin-bottom:6px;border:1px solid var(--line);border-left:3px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.07);}
.pill:last-child{margin-bottom:0;}
.pill b{font-weight:700;display:block;margin-bottom:1px;color:var(--ink);font-size:.79rem;}
.pill small{color:var(--sub);display:block;font-family:var(--font-mono);font-size:.66rem;line-height:1.5;}
.emptystate{padding:60px 20px;text-align:center;color:var(--sub);font-size:.9rem;}
.pill{cursor:pointer;}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modalbg[hidden]{display:none;}
.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
.rosterlist{width:100%;border-collapse:collapse;font-size:.83rem;}
.rosterlist th,.rosterlist td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;}
.ghostbtn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:.78rem;cursor:pointer;font-family:var(--font-body);}
.ghostbtn:hover{border-color:var(--accent);color:var(--accent);}
.meta{font-family:var(--font-mono);font-size:.72rem;color:var(--sub);margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="logo.jpeg" alt="학교 로고" class="logo" onerror="this.style.display='none'">
    <h1>정기시험 시간표</h1>
  </div>
  <div id="content"><div class="emptystate">시간표를 불러오는 중…</div></div>
</div>

<div id="rosterModalBg" class="modalbg" hidden>
  <div class="modalbox">
    <div class="modalhead">
      <h3 id="rosterTitle" style="font-size:1rem;"></h3>
      <button class="ghostbtn" id="rosterCloseBtn">닫기</button>
    </div>
    <div id="rosterBody"></div>
  </div>
</div>

<script>
let DATA = null;
let gradeFilter = 'all';
let currentDay = null;

function fromBase64Url(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
async function gzipDecompress(bytes){
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
// 링크 자체(#dz=압축 또는 #d=평문)에 시간표 데이터가 담겨 있으면 그걸 바로 쓰고, 없으면 같은 위치의 schedule-data.json을 불러온다.
const gzMatch = location.hash.match(/^#dz=(.+)$/);
const hashMatch = location.hash.match(/^#d=(.+)$/);
if(gzMatch){
  gzipDecompress(fromBase64Url(gzMatch[1])).then(json=>{
    DATA = JSON.parse(json); currentDay = DATA.days[0]; render();
  }).catch(()=>{
    document.getElementById('content').innerHTML = '<div class="emptystate">공유 링크를 읽을 수 없습니다. 링크가 잘렸을 수 있어요.</div>';
  });
} else if(hashMatch){
  try{
    const json = decodeURIComponent(escape(atob(hashMatch[1])));
    DATA = JSON.parse(json);
    currentDay = DATA.days[0];
    render();
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="emptystate">공유 링크를 읽을 수 없습니다. 링크가 잘렸을 수 있어요.</div>';
  }
} else {
  fetch('schedule-data.json?_=' + Date.now())
    .then(r=>{ if(!r.ok) throw new Error('not found'); return r.json(); })
    .then(d=>{ DATA = d; currentDay = d.days[0]; render(); })
    .catch(()=>{
      document.getElementById('content').innerHTML =
        '<div class="emptystate">아직 공개된 시간표가 없습니다.<br><span class="small">시간표 생성 화면에서 "학생 공유 링크 만들기"를 눌러 링크를 받아주세요.</span></div>';
    });
}

function render(){
  const el = document.getElementById('content');
  const grades = new Set();
  Object.values(DATA.subjects).forEach(s=> s.grades.forEach(g=>grades.add(g)));
  const gradeList = [...grades].sort();

  let html = '<div class="meta">생성: ' + new Date(DATA.generatedAt).toLocaleString('ko-KR') + '</div>';
  html += '<div class="modetabs">' +
    '<div class="modetab ' + (gradeFilter==='all'?'active':'') + '" data-g="all">전체 시간표</div>' +
    gradeList.map(g=>'<div class="modetab ' + (gradeFilter===String(g)?'active':'') + '" data-g="' + g + '">' + g + '학년 시간표</div>').join('') +
    '</div>';
  html += '<div class="daytabs">' + DATA.days.map(d=>
    '<div class="daytab ' + (d===currentDay?'active':'') + '" data-day="' + d + '">' + DATA.dayLabels[d] + '</div>'
  ).join('') + '</div>';

  html += '<div class="tablewrap"><table class="grid"><thead><tr><th class="roomcol">강의실</th>' +
    DATA.periods.map(p=>'<th><span class="pno">' + p.no + '교시</span><span class="ptime">' + p.time + '</span></th>').join('') +
    '</tr></thead><tbody>';
  DATA.rooms.forEach(room=>{
    html += '<tr><th class="roomcol ' + (room.big?'roomcol-big':'') + '"><span class="roomname">' + room.name + '</span><span class="roomcap">' + room.cap + '명</span></th>';
    DATA.periods.forEach(p=>{
      const key = currentDay + '_' + p.no;
      const rooms = DATA.slots[key] || [];
      const match = rooms.find(r=>r.name===room.name);
      html += '<td>';
      if(match){
        const items = gradeFilter==='all' ? match.items : match.items.filter(it=>{
          const s = DATA.subjects[it.subjId];
          return s && s.grades.includes(parseInt(gradeFilter,10));
        });
        html += items.map(it=>{
          const s = DATA.subjects[it.subjId];
          const name = s.block ? s.subject + '(' + s.block + ')' : s.subject;
          return '<div class="pill" data-subj="' + it.subjId + '" data-room="' + room.name + '" data-slotkey="' + key + '"><b>' + name + '</b><small>' + s.gradeLabel + '학년 · ' + s.teacher + ' · ' + it.count + '명</small></div>';
        }).join('');
      }
      html += '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  el.innerHTML = html;

  el.querySelectorAll('.pill[data-subj]').forEach(p=> p.onclick = ()=> openRoster(p.dataset.subj, p.dataset.room, p.dataset.slotkey));
  el.querySelectorAll('[data-g]').forEach(t=> t.onclick = ()=>{ gradeFilter = t.dataset.g; render(); });
  el.querySelectorAll('[data-day]').forEach(t=> t.onclick = ()=>{ currentDay = t.dataset.day; render(); });
}

function openRoster(subjId, roomName, slotKey){
  const s = DATA.subjects[subjId]; if(!s) return;
  const room = (DATA.slots[slotKey]||[]).find(r=>r.name===roomName);
  const item = room ? (room.items||[]).find(it=>it.subjId===subjId) : null;
  const idsToShow = (item && item.students && item.students.length) ? item.students : (s.students||[]);
  const list = idsToShow.map(sid=>({id:sid, ...(DATA.students && DATA.students[sid] || {name:sid, grade:''})}))
    .sort((a,b)=> (a.grade-b.grade) || String(a.name).localeCompare(String(b.name),'ko'));
  document.getElementById('rosterTitle').textContent = s.subject + (s.block?'('+s.block+')':'') + ' · ' + s.teacher;
  const roomLine = item ? ('<div class="small" style="margin-bottom:8px;">' + roomName + ' 배정 인원: <b>' + item.count + '명</b> (과목 전체 ' + s.count + '명 중)</div>') : ('<div class="small" style="margin-bottom:8px;">전체 수강생: <b>' + s.count + '명</b></div>');
  document.getElementById('rosterBody').innerHTML = roomLine +
    '<table class="rosterlist"><thead><tr><th>#</th><th>학년</th><th>이름</th></tr></thead><tbody>' +
    list.map((st,i)=>'<tr><td>' + (i+1) + '</td><td>' + st.grade + '</td><td>' + st.name + '</td></tr>').join('') +
    '</tbody></table>';
  document.getElementById('rosterModalBg').hidden = false;
}
document.getElementById('rosterCloseBtn').onclick = ()=>{ document.getElementById('rosterModalBg').hidden = true; };
document.getElementById('rosterModalBg').addEventListener('click', ev=>{ if(ev.target.id==='rosterModalBg') ev.currentTarget.hidden = true; });
</script>
</body>
</html>
